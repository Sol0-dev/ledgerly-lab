{% extends "base.html" %}
{% block title %}Sign in &middot; Ledgerly{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">L</span>
      <span>Ledgerly</span>
    </div>
    <h1>{{ ctx.login_copy }}</h1>
    <p class="tagline">Invoice management for growing teams</p>

    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>

    <p class="form-hint">
      Demo account: <span class="mono">hunter</span> / <span class="mono">hunter-pass</span>
      &middot; <a href="{{ url_for('register') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
