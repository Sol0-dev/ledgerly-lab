{% extends "base.html" %}
{% block title %}{{ code }} &middot; Ledgerly{% endblock %}
{% block content %}
<div class="auth-wrap" style="min-height:60vh">
  <div class="auth-card" style="text-align:center">
    <h1 style="font-size:34px;color:var(--accent);margin:0">{{ code }}</h1>
    <p class="muted" style="margin:8px 0 4px">{{ message }}</p>

  </div>
</div>
{% endblock %}
