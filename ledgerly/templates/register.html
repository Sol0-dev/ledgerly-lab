{% extends "base.html" %}
{% block title %}Create account &middot; Ledgerly{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">L</span>
      <span>Ledgerly</span>
    </div>
    <h1>Create an account</h1>
    <p class="tagline">Invite yourself to your workspace</p>

    <form method="post" action="{{ url_for('register') }}">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <button class="btn primary block" type="submit">Create account</button>
    </form>

    <p class="form-hint">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
